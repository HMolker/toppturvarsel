<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molker</title>
<style>
  :root { color-scheme: light dark; --bg: #F4F3EF; --card: #fff; --ink: #1A1A1A; --muted: #706C64; --line: #D8D5CC; --red: #C0392B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121211; --card: #1A1A1A; --ink: #EDEBE5; --muted: #A8A49B; --line: #3A3833; --red: #E46A5C; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { width: min(420px, 100%); }
  h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 14px; }
  a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; color: var(--ink); text-decoration: none; }
  a:hover { border-color: var(--red); }
  a b { display: block; font-size: 18px; }
  a span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Molker</h1>
  <a href="/fjallskred/"><b>Fjällskred</b><span>Ski touring conditions for Norway and Sweden</span></a>
  <a href="/molker-hemma/"><b>Molker hemma</b></a>
</main>
</body>
</html>
