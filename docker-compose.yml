services:
  toppturvarsel:
    # Ready-made image from GitHub (built by .github/workflows/image.yml).
    # FJALLSKRED_VERSION in .env picks it: "latest", or a tag such as "v4.0".
    #   update / switch:  docker compose pull && docker compose up -d
    #   build here instead: docker compose up -d --build
    image: ghcr.io/hmolker/toppturvarsel:${FJALLSKRED_VERSION:-latest}
    build: .
    container_name: toppturvarsel
    restart: unless-stopped
    ports:
      # Port on the Pi: set HOST_PORT in .env (kept across updates).
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      # Snapshots, alert ledger and history survive restarts and upgrades.
      - ./data/cache:/app/data/cache
      # Your own GPX files, one per tour slug; read-only is enough.
      - ./data/tracks:/app/data/tracks:ro
      # Your own photos, one folder per tour slug with a photos.json (made by
      # the tour editor); read-only is enough.
      - ./data/photos:/app/data/photos:ro
    # The service holds no secrets beyond the notification keys in .env and
    # writes nothing outside its volume, so it can run read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
